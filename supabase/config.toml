# Configuración de las Edge Functions.
#
# Por defecto Supabase exige un token de sesión (JWT) para llamar a una
# función. Eso está bien para crear-sesion-pago, que la llama el navegador
# con la sesión del cliente ya iniciada.
#
# Pero webhook-stripe la llama STRIPE, no un navegador, y Stripe no manda
# ninguna cabecera Authorization: con la verificación activada, Supabase
# rechazaba todos los avisos con 401 antes de que el código llegara a
# ejecutarse. Resultado: el cobro se hacía en Stripe pero el pedido nunca
# pasaba a "pagado" ni se enviaban los emails.
#
# Desactivarla aquí NO deja la función abierta: lo primero que hace es
# verificar la firma criptográfica de Stripe (constructEventAsync) y
# rechazar cualquier petición que no venga firmada con el secreto del
# webhook. Esa es la comprobación correcta para un webhook.
#
# Este archivo existe para que la configuración sea permanente: si se
# dependiera solo del flag --no-verify-jwt al desplegar, un despliegue
# futuro sin ese flag volvería a romper los pagos en silencio.
[functions.webhook-stripe]
verify_jwt = false

# El formulario de contacto lo rellena gente que NO ha iniciado sesión
# (nadie se registra para escribir un mensaje), así que tampoco puede
# mandar un token de sesión. Con la verificación activada, Supabase
# rechazaría todos los mensajes con 401.
#
# La función no queda desprotegida: valida longitudes y formato, lleva un
# campo trampa (honeypot) para bots, limita a 3 envíos por IP cada 10
# minutos y solo acepta llamadas desde el dominio de Cozumel. Además no
# toca la base de datos: como mucho, manda un email.
[functions.enviar-contacto]
verify_jwt = false

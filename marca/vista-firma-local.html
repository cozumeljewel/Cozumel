<!--
  FIRMA DE CORREO · Eduardo Troncoso · Cozumel Jewelry

  Cómo ponerla en Gmail:
    1. Abre este archivo en el navegador (doble clic).
    2. Selecciona la firma entera con el ratón y cópiala (Ctrl+C).
    3. Gmail → rueda dentada → "Ver toda la configuración" → pestaña
       "General" → "Firma" → Crear nueva → pega (Ctrl+V).
    4. Abajo del todo, "Guardar cambios".

  En Outlook: Archivo → Opciones → Correo → Firmas → Nueva → pegar.

  Por qué está hecha con tablas y estilos escritos a mano: los gestores
  de correo borran las hojas de estilo y no entienden flexbox. Con tablas
  y "style" en cada celda se ve igual en Gmail, Outlook y el móvil.

  El logo va como imagen alojada en la web (img/firma-logo.png, fondo
  transparente), no incrustada: así no viaja como adjunto en cada correo.
  OJO: hasta que esa imagen esté publicada en cozumeljewelry.es, en la
  firma se verá un hueco. Si algún día cambia el dominio, hay que
  actualizar esa URL.
-->

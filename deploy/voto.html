<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gracias por tu voto · Cozumel Jewelry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%2314454A'/%3E%3Cellipse cx='50' cy='50' rx='25' ry='31' fill='none' stroke='%23C6A664' stroke-width='5'/%3E%3Cpath d='M26,50 C36,36 64,36 74,50 C64,64 36,64 26,50 Z' fill='none' stroke='%23C6A664' stroke-width='5'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23C6A664'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<!--
  Página de llegada de la votación del email "Men's collection · Muy pronto"
  (emails/hombre-muy-pronto.html, 17/10/2026). Se ve aunque la web esté
  cerrada: NO carga cierre.js. Guarda el voto en la tabla eventos de Supabase
  (evento 'voto_email', fuente 'email', producto = la pieza; migración v34).
  Un voto por pieza y navegador (cozumel_voto_<pieza>).
  · Tocar una foto la abre a pantalla completa con zoom (tocar = ampliar
    donde tocas; arrastrar = moverse; flechas = otras piezas).
  · Debajo, "Mira las otras de cerca": las otras 5 piezas (NO cuentan como voto).
  · Clarity recibe eventos zoom_<pieza> y zoom_ampliado_<pieza> para saber qué miran.
-->
<script src="analitica.js"></script>
<style>
  :root { --fondo:#F8F6F1; --texto:#173634; --suave:#5E6B6A; --oro:#B08A45; --linea:#DCD8D1; --foto:#F1F1EF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto); font-family:'Inter', system-ui, sans-serif; text-align:center; }
  main { width:100%; max-width:440px; margin:0 auto; padding:40px 16px 48px; }
  .logo { margin:0; font-family:'Cormorant Garamond', Georgia, serif; font-weight:500; font-size:34px; letter-spacing:.18em; margin-right:-.18em; line-height:1; }
  .logo span { display:block; margin-top:6px; font-family:'Inter', system-ui, sans-serif; font-size:11px; letter-spacing:.42em; margin-right:-.42em; }
  .eyebrow { margin:28px 0 0; font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--oro); }
  h1 { margin:8px 0 0; font-family:'Cormorant Garamond', Georgia, serif; font-weight:500; font-size:40px; line-height:1.1; }
  button.foto { display:block; position:relative; width:280px; max-width:78vw; aspect-ratio:1; margin:24px auto 0; padding:0; border:0;
    background:var(--foto); border-radius:3px; overflow:hidden; cursor:zoom-in; }
  .foto img { width:100%; height:100%; object-fit:cover; display:block; }
  .lupa { position:absolute; right:10px; bottom:10px; display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:20px;
    background:rgba(248,246,241,.92); color:var(--texto); font:500 11px 'Inter', system-ui, sans-serif; letter-spacing:.06em; }
  .lupa svg { width:14px; height:14px; }
  .pieza { margin:14px 0 0; font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; }
  .tipo { margin:2px 0 0; font-size:13px; color:var(--suave); }
  .texto { margin:22px 0 0; font-size:15px; line-height:1.6; }
  .sorteo { margin:22px 0 0; padding:14px 16px; border:1px solid #C6A664; border-radius:4px; background:#F8F3E9; color:#7A5F2A; font-size:14px; line-height:1.55; }
  .otras { margin:40px 0 0; padding-top:28px; border-top:1px solid var(--linea); }
  .otras h2 { margin:0; font-family:'Cormorant Garamond', Georgia, serif; font-weight:500; font-size:26px; }
  .otras p { margin:4px 0 0; font-size:13px; color:var(--suave); }
  .rejilla { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-top:18px; }
  .rejilla button { padding:0; border:0; background:none; color:inherit; font:inherit; cursor:zoom-in; text-align:center; }
  .rejilla .mini { display:block; aspect-ratio:1; background:var(--foto); border-radius:3px; overflow:hidden; }
  .rejilla img { width:100%; height:100%; object-fit:cover; display:block; }
  .rejilla b { display:block; margin-top:8px; font-family:'Cormorant Garamond', Georgia, serif; font-weight:500; font-size:19px; }
  .rejilla small { display:block; font-size:12px; color:var(--suave); }
  .firma { margin:36px 0 0; font-family:'Cormorant Garamond', Georgia, serif; font-size:22px; }

  /* Visor a pantalla completa con zoom */
  .visor { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; background:var(--foto); }
  .visor[hidden] { display:none; }
  .visor-zona { position:relative; flex:1; overflow:hidden; touch-action:none; cursor:zoom-in; }
  .visor-zona.ampliada { cursor:zoom-out; }
  .visor-zona img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply;
    transition:transform .25s ease; user-select:none; -webkit-user-drag:none; }
  .visor-zona.moviendo img { transition:none; }
  .visor-pie { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--fondo); border-top:1px solid var(--linea); }
  .visor-pie .nombre { flex:1; margin:0; font-family:'Cormorant Garamond', Georgia, serif; font-size:22px; line-height:1.1; }
  .visor-pie .nombre small { display:block; font-family:'Inter', system-ui, sans-serif; font-size:12px; color:var(--suave); }
  .visor button.flecha, .visor button.cerrar { width:44px; height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--linea); border-radius:50%; background:var(--fondo); color:var(--texto); cursor:pointer; }
  .visor button.cerrar { position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; z-index:2; }
  .visor svg { width:18px; height:18px; }
  .visor-ayuda { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); padding:6px 12px; border-radius:20px;
    background:rgba(248,246,241,.92); font-size:12px; pointer-events:none; transition:opacity .3s; white-space:nowrap; }
</style>
</head>
<body data-page="voto">
<main>
  <p class="logo">COZUMEL<span>JEWELRY</span></p>
  <p class="eyebrow">Men’s collection</p>
  <h1>¡Gracias por tu voto!</h1>
  <button type="button" class="foto" hidden aria-label="Ver la pieza de cerca"><img alt=""><span class="lupa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg>Ver de cerca</span></button>
  <p class="pieza" hidden></p>
  <p class="tipo" hidden></p>
  <p class="texto">Te avisaremos por email el día que salga la colección. Tú la verás antes que nadie.</p>
  <p class="sorteo">Con tu primera compra entrarás en el sorteo de <strong>5 videollamadas con Adri</strong>.</p>

  <section class="otras" aria-label="Las otras piezas">
    <h2>Míralas de cerca</h2>
    <p>Toca cualquiera para ampliarla.</p>
    <div class="rejilla"></div>
  </section>

  <p class="firma">Adri 🤍</p>
</main>

<div class="visor" hidden role="dialog" aria-modal="true" aria-label="Pieza ampliada">
  <div class="visor-zona"><img alt=""><span class="visor-ayuda">Toca para ampliar</span></div>
  <button type="button" class="cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="visor-pie">
    <button type="button" class="flecha anterior" aria-label="Pieza anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <p class="nombre"></p>
    <button type="button" class="flecha siguiente" aria-label="Pieza siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>

<script>
(function () {
  // grande = foto a tamaño completo para el zoom (versión web de img/w; si falta, el original)
  const PIEZAS = {
    mezcal: { nombre: 'Mezcal', tipo: 'Collar con cruz · oro', id: 'hombre_collar_3',   grande: 'img/w/full/hombre/collar-3-oro-charm-cruz-2.png.webp' },
    copal:  { nombre: 'Copal',  tipo: 'Cadena · plata',        id: 'hombre_collar_7',   grande: 'img/w/full/hombre/collar-7-oro-blanco-producto.png.webp' },
    uxmal:  { nombre: 'Uxmal',  tipo: 'Pulsera · plata',       id: 'hombre_pulsera_10', grande: 'img/w/full/hombre/pulsera-10-plata-producto.png.webp' },
    tulum:  { nombre: 'Tulum',  tipo: 'Pulsera · oro',         id: 'hombre_pulsera_3',  grande: 'img/hombre/pulsera-3-oro-producto.jpg' },
    ocaso:  { nombre: 'Ocaso',  tipo: 'Anillo sello · oro',    id: 'hombre_anillo_1',   grande: 'img/w/full/hombre/anillo-1-oro-producto.png.webp' },
    charro: { nombre: 'Charro', tipo: 'Anillo · plata',        id: 'hombre_anillo_11',  grande: 'img/w/full/hombre/anillo-11-plata-producto.png.webp' },
  };
  const ORDEN = Object.keys(PIEZAS);
  const evento = (nombre) => { if (typeof window.clarity === 'function') window.clarity('event', nombre); };
  const original = (src) => { const m = src.match(/^img\/w\/[^/]+\/(.+)\.webp$/); return m ? 'img/' + m[1] : src; };

  const clave = (new URLSearchParams(location.search).get('p') || '').toLowerCase();
  const pieza = PIEZAS[clave];

  /* ---------- Visor con zoom ---------- */
  const visor = document.querySelector('.visor');
  const zona = visor.querySelector('.visor-zona');
  const grande = zona.querySelector('img');
  const ayuda = zona.querySelector('.visor-ayuda');
  const nombreVisor = visor.querySelector('.nombre');
  const ZOOM = 2.6;
  let actual = null, ampliada = false, ox = 50, oy = 50;
  let arrastre = null;

  grande.addEventListener('error', () => {
    const o = original(grande.getAttribute('src'));
    if (o !== grande.getAttribute('src')) grande.src = o;
  });

  function pintarZoom() {
    zona.classList.toggle('ampliada', ampliada);
    grande.style.transformOrigin = ox + '% ' + oy + '%';
    grande.style.transform = ampliada ? 'scale(' + ZOOM + ')' : 'none';
  }
  function abrir(k) {
    actual = k;
    const p = PIEZAS[k];
    grande.src = p.grande;
    grande.alt = p.nombre + ' · ' + p.tipo;
    nombreVisor.textContent = p.nombre;
    const s = document.createElement('small'); s.textContent = p.tipo; nombreVisor.append(s);
    ampliada = false; ox = oy = 50; pintarZoom();
    ayuda.style.opacity = '1';
    if (visor.hidden) { visor.hidden = false; document.body.style.overflow = 'hidden'; }
    evento('zoom_' + k);
  }
  function cerrar() { visor.hidden = true; document.body.style.overflow = ''; }
  function mover(paso) { abrir(ORDEN[(ORDEN.indexOf(actual) + paso + ORDEN.length) % ORDEN.length]); }
  function puntoEnZona(e) {
    const r = zona.getBoundingClientRect();
    return [Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100)), Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100))];
  }

  // Tocar = ampliar donde tocas / volver. Con el zoom puesto, arrastrar mueve la foto.
  zona.addEventListener('pointerdown', (e) => {
    arrastre = { x: e.clientX, y: e.clientY, ox, oy, movido: false };
    zona.setPointerCapture(e.pointerId);
  });
  zona.addEventListener('pointermove', (e) => {
    if (!ampliada) return;
    if (arrastre) {
      const r = zona.getBoundingClientRect();
      const dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
      if (Math.abs(dx) + Math.abs(dy) > 6) arrastre.movido = true;
      if (!arrastre.movido) return;
      zona.classList.add('moviendo');
      // Arrastrar hacia la derecha enseña lo que hay a la izquierda
      ox = Math.min(100, Math.max(0, arrastre.ox - dx / r.width * 100 * ZOOM / (ZOOM - 1)));
      oy = Math.min(100, Math.max(0, arrastre.oy - dy / r.height * 100 * ZOOM / (ZOOM - 1)));
      pintarZoom();
    } else if (e.pointerType === 'mouse') {
      zona.classList.add('moviendo');
      [ox, oy] = puntoEnZona(e); pintarZoom();
    }
  });
  zona.addEventListener('pointerup', (e) => {
    const movido = arrastre && arrastre.movido;
    arrastre = null;
    zona.classList.remove('moviendo');
    if (movido) return;
    ayuda.style.opacity = '0';
    if (!ampliada) { [ox, oy] = puntoEnZona(e); ampliada = true; evento('zoom_ampliado_' + actual); }
    else ampliada = false;
    pintarZoom();
  });
  zona.addEventListener('pointercancel', () => { arrastre = null; zona.classList.remove('moviendo'); });
  visor.querySelector('.cerrar').addEventListener('click', cerrar);
  visor.querySelector('.anterior').addEventListener('click', () => mover(-1));
  visor.querySelector('.siguiente').addEventListener('click', () => mover(1));
  document.addEventListener('keydown', (e) => {
    if (visor.hidden) return;
    if (e.key === 'Escape') cerrar();
    if (e.key === 'ArrowLeft') mover(-1);
    if (e.key === 'ArrowRight') mover(1);
  });

  /* ---------- Las otras piezas ---------- */
  const rejilla = document.querySelector('.rejilla');
  ORDEN.filter(k => k !== clave).forEach(k => {
    const p = PIEZAS[k];
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', 'Ver ' + p.nombre + ' de cerca');
    b.innerHTML = '<span class="mini"><img loading="lazy" alt=""></span><b></b><small></small>';
    b.querySelector('img').src = 'img/email-voto-' + k + '.jpg';
    b.querySelector('b').textContent = p.nombre;
    b.querySelector('small').textContent = p.tipo;
    b.addEventListener('click', () => abrir(k));
    rejilla.append(b);
  });

  if (!pieza) {
    document.querySelector('h1').textContent = 'Nuestra colección para hombre';
    return;
  }

  /* ---------- La pieza votada ---------- */
  const foto = document.querySelector('.foto');
  foto.querySelector('img').src = 'img/email-voto-' + clave + '.jpg';
  foto.querySelector('img').alt = pieza.nombre + ' · ' + pieza.tipo;
  foto.hidden = false;
  foto.addEventListener('click', () => abrir(clave));
  const nombre = document.querySelector('.pieza');
  nombre.textContent = pieza.nombre; nombre.hidden = false;
  const tipo = document.querySelector('.tipo');
  tipo.textContent = pieza.tipo; tipo.hidden = false;
  document.querySelector('.otras h2').textContent = 'Mira las otras de cerca';
  evento('voto_' + clave);
  // Precarga la grande para que el zoom se abra al momento
  new Image().src = pieza.grande;

  // Un voto por pieza y navegador
  const YA = 'cozumel_voto_' + clave;
  try { if (localStorage.getItem(YA)) return; } catch (_) {}
  const SUPABASE = {
    url: 'https://qesyjtqxbouodgldvbtq.supabase.co',
    clave: 'sb_publishable_lmFNgpMEy4Axi6dYQ9E1UA_b63xSwJ6',
  };
  const id = (crypto.randomUUID && crypto.randomUUID()) ||
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  fetch(SUPABASE.url + '/rest/v1/eventos', {
    method: 'POST',
    headers: { apikey: SUPABASE.clave, Authorization: 'Bearer ' + SUPABASE.clave, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ evento: 'voto_email', session_id: id, fuente: 'email', producto: pieza.id }),
  }).then(r => { if (r.ok) { try { localStorage.setItem(YA, '1'); } catch (_) {} } })
    .catch(() => {});
})();
</script>
</body>
</html>

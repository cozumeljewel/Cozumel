<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo — Cozumel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,500&family=Jost:wght@300;400;500;600&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#F2F8F8; --dark:#14454A; --taupe:#4E9A9B; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#D3E7EA; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:30px;}
  .lockup{
    width:420px; aspect-ratio:1/1.02; background:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:40px; text-align:center;
  }
  .lockup svg{width:96px; height:96px; color:var(--dark);}
  .wordmark{
    font-family:'Playfair Display'; font-weight:400; font-size:64px;
    letter-spacing:.04em; color:var(--dark); line-height:1;
  }
  .tagline-row{
    display:flex; align-items:center; gap:22px; justify-content:center;
  }
  .tagline-row .side{
    font-family:'Jost'; font-size:11px; font-weight:500; letter-spacing:.06em;
    color:var(--dark); line-height:1.4; text-align:center;
  }
  .tagline-row .center{
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .tagline-row .center .label{
    font-family:'Jost'; font-weight:700; font-size:16px; letter-spacing:.1em; color:var(--dark);
  }
  .tagline-row .center .city{
    font-family:'Petit Formal Script'; font-size:20px; color:var(--dark);
    border-bottom:1px solid var(--dark); padding-bottom:2px;
  }
</style>
</head>
<body>

  <div class="lockup">
    <svg viewBox="-15 -15 130 140" xmlns="http://www.w3.org/2000/svg">
      <g stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round">
        <line x1="84" y1="52" x2="95.9" y2="52"/>
        <line x1="79.4" y1="72" x2="89.7" y2="79"/>
        <line x1="67" y1="86.6" x2="72.95" y2="98.8"/>
        <line x1="50" y1="92" x2="50" y2="106"/>
        <line x1="33" y1="86.6" x2="27.05" y2="98.8"/>
        <line x1="20.6" y1="72" x2="10.25" y2="79"/>
        <line x1="16" y1="52" x2="4.1" y2="52"/>
        <line x1="20.6" y1="32" x2="10.25" y2="25"/>
        <line x1="33" y1="17.4" x2="27.05" y2="5.2"/>
        <line x1="50" y1="12" x2="50" y2="-2"/>
        <line x1="67" y1="17.4" x2="72.95" y2="5.2"/>
        <line x1="79.4" y1="32" x2="89.7" y2="25"/>
      </g>
      <ellipse cx="50" cy="52" rx="34" ry="40" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <path d="M18,52 C30,36 70,36 82,52 C70,66 30,66 18,52 Z" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <circle cx="50" cy="52" r="7" fill="currentColor"/>
    </svg>

    <div class="wordmark">COZUMEL</div>

    <div class="tagline-row">
      <div class="side">MODERN<br>HEIRLOOMS</div>
      <div class="center">
        <span class="label">JEWELRY</span>
        <span class="city">México</span>
      </div>
      <div class="side">CREATED<br>TO&nbsp;ADORN</div>
    </div>
  </div>

</body>
</html>
